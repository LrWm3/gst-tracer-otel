# AArch64 native frame chains, including leaf functions, for the CPU sampler.
[built-in options]
c_args = ['-gdwarf-5', '-fno-omit-frame-pointer', '-mno-omit-leaf-frame-pointer']
cpp_args = ['-gdwarf-5', '-fno-omit-frame-pointer', '-mno-omit-leaf-frame-pointer']
strip = false
debug = true
optimization = '2'
