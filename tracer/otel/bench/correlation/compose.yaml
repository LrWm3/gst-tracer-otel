# Local, ephemeral metric/trace/profile demo. All host ports use loopback.
name: mars-correlation-demo
services:
  prometheus:
    image: prom/prometheus:v3.3.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
      - --enable-feature=exemplar-storage
      - --storage.tsdb.retention.time=2h
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:49090:9090"
  tempo:
    image: grafana/tempo:2.10.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "127.0.0.1:43200:3200"
      - "127.0.0.1:44318:4318"
  pyroscope:
    image: grafana/pyroscope:2.4.0
    ports:
      - "127.0.0.1:44041:4040"
  grafana:
    image: grafana/grafana:13.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      # Explore requires Editor; this disposable demo binds only to loopback.
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./datasources.yaml:/etc/grafana/provisioning/datasources/mars.yaml:ro
    ports:
      - "127.0.0.1:43002:3000"
    depends_on:
      - prometheus
      - tempo
      - pyroscope
