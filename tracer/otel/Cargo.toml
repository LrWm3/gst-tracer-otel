[package]
name        = "gst-otel-tracer"
version     = "0.1.0"
edition     = "2021"

[lib]
name = "gstoteltracer"
crate-type  = ["cdylib", "rlib"]

[dependencies]
glib.workspace=true
gstreamer.workspace=true
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace", "logs"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "logs"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "logs"] }
crossbeam-channel = "0.5"
arc-swap = "1.7"
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = "0.14"
bytes = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
tokio = { version = "1", features = ["rt", "time", "net"] }
percent-encoding = "2"
[dev-dependencies]
futures-executor = "0.3"
tiny_http = "0.12"

[features]
noop = []
capi = []
