[package]
name        = "gst-otel-tracer"
version     = "0.1.0"
edition     = "2021"

[lib]
name = "gstoteltracer"
crate-type  = ["cdylib", "rlib"]

[dependencies]
glib.workspace=true
gstreamer.workspace=true
opentelemetry = { version = "0.30.0", default-features = false, features = ["trace", "logs"] }
opentelemetry-otlp = { version = "0.30.0", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls-webpki-roots", "logs", "trace"] }
opentelemetry_sdk = { version = "0.30.0", default-features = false, features = ["trace", "logs"] }
crossbeam-channel = "0.5"
futures-executor = "0.3"
arc-swap = "1.7"
[dev-dependencies]
opentelemetry-proto = { version = "0.30.0", default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = "0.13"
tiny_http = "0.12"

[features]
noop = []
capi = []
