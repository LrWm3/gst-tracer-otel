[package]
name        = "gst-otel-tracer"
version     = "0.1.0"
edition     = "2021"

[lib]
name = "gstoteltracer"
crate-type  = ["cdylib", "rlib"]

[dependencies]
glib.workspace=true
gstreamer.workspace=true
gst-mars-metrics-core = { path = "../metrics-core" }
tiny_http = "0.12"
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace", "logs"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "logs"] }
crossbeam-channel = "0.5"
arc-swap = "1.7"
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "trace", "metrics", "logs"] }
prost = "0.14"
bytes = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
tokio = { version = "1.53.3", features = ["rt", "time", "net"] }
percent-encoding = "2"
pyroscope = { version = "=2.1.2", optional = true }
libc = "0.2"
addr2line = { version = "0.27.1", optional = true }
object = { version = "0.40", default-features = false, features = ["read", "std"], optional = true }
# OTLP request compression; also used to decode Pyroscope test uploads.
libflate = "2"
[dev-dependencies]
futures-executor = "0.3"

[features]
noop = []
capi = []
profiles = ["dep:pyroscope", "dep:addr2line", "dep:object", "gstreamer/v1_22"]

[[example]]
name = "profile_video"
required-features = ["profiles"]

[[example]]
name = "profile_elements"
required-features = ["profiles"]

[[example]]
name = "profile_correlation"
required-features = ["profiles"]

[[example]]
name = "lifecycle_soak"
required-features = ["profiles"]
