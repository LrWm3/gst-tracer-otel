[workspace]
resolver = "3"
exclude = ["vendor/opentelemetry-proto"]
members = [
    "tracer/otel",
    "tracer/noop",
    "tracer/prometheus",
    "tracer/pyroscope",
]

default-members = [
    "tracer/prometheus",
]

[workspace.package]
version = "0.1.0"
repository = "https://github.com/LrWm3/gst-tracer-otel"
edition = "2024"
license = "LGPL"

[workspace.dependencies]
# ── GStreamer stack ───────────────────────────────────────────────
glib = "0.20"
gobject-sys = "0.20"
gstreamer         = { version = "0.23.6" }
gstreamer-sys     = "0.23.6"  # raw FFI for hook registration

[profile.profiling]
inherits = "release"
debug = true

[profile.test]
inherits = "dev"

# Pinned 0.30 conversion fix: consume owned SpanData without cloning it.
[patch.crates-io]
opentelemetry-proto = { path = "vendor/opentelemetry-proto" }
