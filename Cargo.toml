[workspace]
resolver = "3"
members = [
    "tracer/otel",
    "tracer/noop",
    "tracer/prometheus",
]

default-members = [
    "tracer/prometheus",
]

[workspace.package]
version = "0.1.0"
repository = "https://github.com/LrWm3/gst-tracer-otel"
edition = "2024"
license = "LGPL"

[workspace.dependencies]
# ── GStreamer stack ───────────────────────────────────────────────
glib = "0.21"
gobject-sys = "0.21"
gstreamer         = { version = "0.24.5" }
gstreamer-sys     = "0.24.5"  # raw FFI for hook registration

[profile.profiling]
inherits = "release"
debug = true

[profile.test]
inherits = "dev"
